<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="150" viewBox="0 0 400 150">
<style>
  .title { font: 700 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .desc { font: 400 12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #E6E6E6; }
  .meta { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #CFCFCF; }
  .tag { font: 700 11px Consolas, 'Courier New', monospace; fill: #39FF14; animation: flicker 2.66s steps(1) infinite; }
  .main { animation: jitter 3.8s steps(1) infinite; }
  .gr { fill: #FF1F3D; opacity: .85; animation: ghostR 3.8s steps(1) infinite; }
  .gc { fill: #00E5FF; opacity: .85; animation: ghostC 3.8s steps(1) infinite; }
  .s1 { animation: slice1 3.8s steps(1) infinite; }
  .s2 { animation: slice2 4.94s steps(1) infinite; }
  .bar { opacity: 0; animation: flash 3.8s steps(1) infinite; }
  @keyframes jitter {
    0%, 82%, 100% { transform: translate(0, 0); }
    84% { transform: translate(-3px, 1px); } 87% { transform: translate(4px, -1px); }
    90% { transform: translate(-2px, 0); } 93% { transform: translate(2px, 1px); } 96% { transform: translate(0, 0); }
  }
  @keyframes ghostR {
    0%, 82%, 100% { transform: translate(1.5px, 0); }
    84% { transform: translate(6px, -1px); } 88% { transform: translate(-4px, 1px); } 92% { transform: translate(9px, 0); }
  }
  @keyframes ghostC {
    0%, 82%, 100% { transform: translate(-1.5px, 0); }
    84% { transform: translate(-6px, 1px); } 88% { transform: translate(5px, -1px); } 92% { transform: translate(-8px, 0); }
  }
  @keyframes slice1 {
    0%, 80%, 100% { transform: translateX(0); }
    81% { transform: translateX(-18px); } 85% { transform: translateX(12px); } 89% { transform: translateX(-6px); } 92% { transform: translateX(0); }
  }
  @keyframes slice2 {
    0%, 70%, 100% { transform: translateX(0); }
    72% { transform: translateX(22px); } 76% { transform: translateX(-10px); } 80% { transform: translateX(0); }
  }
  @keyframes flash {
    0%, 80%, 100% { opacity: 0; } 82% { opacity: .9; } 86% { opacity: 0; } 90% { opacity: .8; } 94% { opacity: 0; }
  }
  @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: .25; } 55% { opacity: 1; } 80% { opacity: .5; } }
</style>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00A8FF"/><stop offset=".35" stop-color="#FF1F3D"/>
    <stop offset=".65" stop-color="#FFD300"/><stop offset="1" stop-color="#39FF14"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="5.70s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
  <clipPath id="band1"><rect x="0" y="40" width="400" height="16">
    <animate attributeName="y" values="38;96;60;20;112" dur="4.18s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="band2"><rect x="0" y="100" width="400" height="9">
    <animate attributeName="y" values="100;24;76;130;50" dur="6.46s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
  <g id="content">
    <g transform="translate(22 22)" fill="#FFD300">
      <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.71 1.71.75.75 0 0 1-1.07 1.05A2.5 2.5 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.71A2.5 2.5 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.09a.25.25 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
    </g>
    <text x="46" y="36" class="title gr">stealer-recreation</text>
    <text x="46" y="36" class="title gc">stealer-recreation</text>
    <text x="46" y="36" class="title" fill="#FFD300">stealer-recreation</text>
    <text x="384" y="24" class="tag" text-anchor="end">[0x04]</text>
    <text y="64" class="desc"><tspan x="22" dy="0">Poker preflop steal-range EV calculator — a from-</tspan><tspan x="22" dy="18">scratch recreation inspired by @GanjinZero's stealer.</tspan></text>
    <circle cx="28" cy="130" r="6" fill="#3572A5"/>
    <text x="40" y="134" class="meta">Python</text>
    
  </g>
</defs>

<rect x="1" y="1" width="398" height="148" rx="8" fill="#0D0D0D"/>
<g class="main"><use xlink:href="#content" href="#content"/></g>
<g clip-path="url(#band1)"><g class="s1"><rect width="400" height="150" fill="#0D0D0D"/><use xlink:href="#content" href="#content"/></g></g>
<g clip-path="url(#band2)"><g class="s2"><rect width="400" height="150" fill="#0D0D0D"/><use xlink:href="#content" href="#content"/></g></g>
<rect class="bar" x="30" y="18" width="70" height="3" fill="#39FF14" style="animation-delay:0.1s"/><rect class="bar" x="250" y="64" width="110" height="2" fill="#FF1F3D" style="animation-delay:0.5s"/><rect class="bar" x="60" y="104" width="40" height="4" fill="#FFD300" style="animation-delay:0.9s"/><rect class="bar" x="300" y="118" width="60" height="3" fill="#00E5FF" style="animation-delay:1.3s"/><rect class="bar" x="180" y="30" width="30" height="5" fill="#FFD300" style="animation-delay:1.7s"/><rect class="bar" x="12" y="84" width="90" height="2" fill="#00A8FF" style="animation-delay:2.1s"/>
<rect width="400" height="150" rx="8" fill="url(#scan)"/>
<rect x="1" y="1" width="398" height="148" rx="8" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>
